# One blank-image pass of each model before the server opens its port.
warmup: true
# Images the agent sends to the models; null: a fresh temporary directory.
workdir: null
# The arms' mounts (entity_origin_pose of dual_x5, left then right) for clients
# without a robot manager (EVAL_ENV_TYPE=debug); RoboDojo sends its own.
robot_origin_poses:
